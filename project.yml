name: CopyWell
options:
  bundleIdPrefix: com.copywell
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  developmentLanguage: en
  knownRegions:
    - ar
    - bn
    - ca
    - cs
    - da
    - de
    - el
    - en
    - es
    - fi
    - fr
    - gu
    - he
    - hi
    - hr
    - hu
    - id
    - it
    - ja
    - kn
    - ko
    - ml
    - mr
    - ms
    - nb
    - nl
    - or
    - pa
    - pl
    - pt-BR
    - pt-PT
    - ro
    - ru
    - sk
    - sl
    - sv
    - ta
    - te
    - th
    - tr
    - uk
    - ur
    - vi
    - zh-Hans
    - zh-Hant

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "37"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "54NPZH7Z2Q"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Without this the build emits no .stringsdata and the string catalogue
    # can never be filled from the source.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  CopyWell:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
          - "Resources/CopyWell.entitlements"
          - "Resources/Assets.xcassets"
          - "Resources/Localizable.xcstrings"
          - "Resources/ServicesMenu.xcstrings"
          - "Resources/InfoPlist.xcstrings"
      # Declared explicitly: picked up by the generic include above it never
      # reached actool, so the app shipped with no icon at all.
      - path: Sources/Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Resources/Localizable.xcstrings
        buildPhase: resources
      # The Services menu titles come from Info.plist and are translated
      # through a table of their own, which macOS looks up by this name.
      - path: Sources/Resources/ServicesMenu.xcstrings
        buildPhase: resources
      # The camera and microphone explanations macOS shows when it asks.
      - path: Sources/Resources/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - target: CopyWellFinder
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copywell.app
        PRODUCT_NAME: CopyWell
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/CopyWell.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        debug:
          OTHER_SWIFT_FLAGS: "$(inherited) -DDEBUG"
    # No `info:` block on purpose: XcodeGen generates a plist at `info.path` and
    # overwrites the file, which silently destroyed the Services entries, the app
    # category and the encryption declaration. INFOPLIST_FILE points at the file
    # we maintain by hand.

  CopyWellFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes:
          - "Info.plist"
          - "CopyWellFinder.entitlements"
          - "Localizable.xcstrings"
      # Its own small catalogue. The extension runs inside Finder, not inside
      # CopyWell, so it looks strings up in its own bundle — without this its
      # three alerts were English in all 34 languages. Kept separate rather
      # than shipping the app's whole catalogue twice.
      - path: FinderExtension/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copywell.app.finder
        PRODUCT_NAME: CopyWellFinder
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/CopyWellFinder.entitlements
        SKIP_INSTALL: YES

  CopyWellTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      # SKTestSession loads the configuration from the test bundle, so the same
      # file the app runs against is what the purchase tests exercise.
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: CopyWell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copywell.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CopyWell:
    build:
      targets:
        CopyWell: all
        CopyWellTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Products.storekit
      targets:
        - CopyWellTests
    archive:
      config: Release
