<!DOCTYPE html>
<meta charset="utf-8">
<title>CopyWell store shots</title>
<style>
  /*
   * One look for the whole listing, shared with the capture shots the app
   * renders itself (Sources/App/FeatureShots.swift): a near-black ground lit
   * by two coloured glows, the header centred at the top, and the scene on a
   * Mac screen — wallpaper, menu bar, windows — below it. Each frame sets its
   * own two glow colours; everything else is the same everywhere.
   */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #050509; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }

  .frame { position: relative; width: 1440px; height: 900px; overflow: hidden;
    background:
      radial-gradient(circle 380px at 780px 120px, rgba(var(--g1), .35) 0%, rgba(var(--g1), .16) 50%, rgba(var(--g1), 0) 100%),
      radial-gradient(circle 560px at 1260px 750px, rgba(var(--g2), .7) 0%, rgba(var(--g2), .32) 50%, rgba(var(--g2), 0) 100%),
      radial-gradient(circle 620px at 250px 870px, rgba(var(--g1), .75) 0%, rgba(var(--g1), .34) 50%, rgba(var(--g1), 0) 100%),
      linear-gradient(180deg, #0f0f17 0%, #050509 100%); }

  .head { position: absolute; left: 0; right: 0; top: 58px; text-align: center; z-index: 5; }
  .eyebrow { display: inline-block; font-size: 17px; font-weight: 800; letter-spacing: 3.5px; text-transform: uppercase;
    background: linear-gradient(90deg, rgb(var(--g1)), rgb(var(--g2))); -webkit-background-clip: text; color: transparent; }
  h1 { font-size: 60px; line-height: 1.12; font-weight: 800; letter-spacing: -1.4px; margin-top: 10px; }
  .sub { font-size: 23px; line-height: 1.38; color: rgba(255,255,255,.66); margin: 12px auto 0; max-width: 980px; text-wrap: balance; }

  /* The Mac the scene happens on. Scene coordinates are the screen's own
     1440 × 900; the screen is shown at 1180 wide. */
  .display { position: absolute; left: 130px; top: 250px; width: 1180px; height: 737.5px; overflow: hidden; border-radius: 18px;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14), 0 26px 100px rgba(0,0,0,.6); }
  .screen { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform: scale(.81944); transform-origin: 0 0; overflow: hidden; }
  .wall-0 { background:
      radial-gradient(circle 620px at 1200px 770px, rgba(242,115,102,.7), rgba(242,115,102,.3) 50%, rgba(242,115,102,0)),
      radial-gradient(circle 520px at 200px 210px, rgba(92,36,122,.8), rgba(92,36,122,.35) 50%, rgba(92,36,122,0)),
      linear-gradient(135deg, rgb(33,26,89), rgb(92,36,122)); }
  .wall-1 { background:
      radial-gradient(circle 620px at 1200px 770px, rgba(140,217,191,.7), rgba(140,217,191,.3) 50%, rgba(140,217,191,0)),
      radial-gradient(circle 520px at 200px 210px, rgba(26,115,128,.8), rgba(26,115,128,.35) 50%, rgba(26,115,128,0)),
      linear-gradient(135deg, rgb(13,51,77), rgb(26,115,128)); }
  .wall-2 { background:
      radial-gradient(circle 620px at 1200px 770px, rgba(255,179,102,.7), rgba(255,179,102,.3) 50%, rgba(255,179,102,0)),
      radial-gradient(circle 520px at 200px 210px, rgba(140,46,51,.8), rgba(140,46,51,.35) 50%, rgba(140,46,51,0)),
      linear-gradient(135deg, rgb(51,20,26), rgb(140,46,51)); }
  .wall-3 { background:
      radial-gradient(circle 620px at 1200px 770px, rgba(120,150,255,.7), rgba(120,150,255,.3) 50%, rgba(120,150,255,0)),
      radial-gradient(circle 520px at 200px 210px, rgba(40,60,160,.8), rgba(40,60,160,.35) 50%, rgba(40,60,160,0)),
      linear-gradient(135deg, rgb(14,22,60), rgb(40,60,160)); }
  .menubar { position: absolute; left: 0; top: 0; width: 1440px; height: 26px; background: rgba(0,0,0,.28);
    display: flex; align-items: center; gap: 18px; padding: 0 18px; font-size: 13px; color: rgba(255,255,255,.92); }
  .menubar b { font-weight: 700; }
  .menubar .sp { flex: 1; }

  /* Windows, drawn as the capture shots draw them. */
  .win { position: absolute; background: #1a1a1a; border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 16px 60px rgba(0,0,0,.5); }
  .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #2b2b2b; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .bar .t { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.7); margin-right: 60px; }

  /* CopyWell's palette, in its dark theme. */
  .pal { position: absolute; width: 520px; border-radius: 16px; overflow: hidden; background: #232833;
         box-shadow: 0 0 0 .5px rgba(255,255,255,.16), 0 40px 90px rgba(0,0,0,.66); }
  .pal .search { display: flex; align-items: center; gap: 11px; padding: 15px 18px; font-size: 18px; color: #8d97ab; border-bottom: 1px solid rgba(255,255,255,.07); }
  .pal .search b { color: #eef1f7; font-weight: 400; }
  .caret { display: inline-block; width: 2px; height: 20px; background: #4f8bff; vertical-align: -4px; }
  .clip { display: flex; align-items: center; gap: 12px; padding: 11px 18px; }
  .clip .n { width: 14px; text-align: right; font-size: 13px; color: #8a93a5; flex: none; }
  .clip .ic { width: 34px; height: 34px; border-radius: 9px; background: #333a49; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .clip .tx { min-width: 0; }
  .clip .tx b { display: block; font-size: 16px; font-weight: 400; color: #eef1f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip .tx span { font-size: 13px; color: #8a93a5; }
  .clip.on { background: #2b3a66; }
  .pal .foot { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.07); font-size: 13px; color: #8a93a5; }
  .key { display: inline-block; min-width: 24px; text-align: center; padding: 3px 7px; border-radius: 6px; background: #333a49; color: #c3cad8; font-size: 12px; margin-right: 6px; }

  /* The callout: a glowing capsule, the same one the capture shots use. */
  .tag { position: absolute; z-index: 6; display: inline-flex; align-items: center; padding: 12px 20px; border-radius: 999px; white-space: nowrap;
    font-size: 21px; font-weight: 700; color: #fff; letter-spacing: -.1px;
    background: linear-gradient(90deg, rgb(var(--t1)), rgb(var(--t2)));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 10px 44px rgba(var(--t1), .55); }
  .tag.down:after, .tag.up:after { content: ""; position: absolute; left: 50%; margin-left: -11px; border: 11px solid transparent; }
  .tag.down:after { bottom: -11px; border-top-color: rgb(var(--t2)); border-bottom: 0; }
  .tag.up:after { top: -11px; border-bottom-color: rgb(var(--t2)); border-top: 0; }

  .mail { padding: 24px 30px; font-size: 17px; line-height: 1.6; color: #c9d1e0; }
  .mail .f { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 15px; }
  .mail .f i { color: #8b93a3; font-style: normal; width: 60px; }
</style>
<body></body>
<!-- Loaded in order while the page parses, so the frame renders in one pass
     with nothing left pending: a script fetched after load kept headless
     Chrome waiting and it never took the screenshot. -->
<script src="strings/en.js"></script>
<script>
  window.S_EN = window.S;
  window.S = undefined;
  (function () {
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    if (lang !== 'en') document.write('<script src="strings/' + lang + '.js"><\/script>');
  })();
</script>
<script>
const params = new URLSearchParams(location.search);
const N = params.get('n') || '1';
const LANG = params.get('lang') || 'en';
const RTL = ['ar', 'he', 'ur'].includes(LANG);

/* Strings come from strings/<lang>.js (made from docs/store/shots/<lang>.json),
   with English underneath for anything missing. */
const t = k => (window.S_LANG && window.S_LANG[k]) || (window.S_EN && window.S_EN[k]) || k;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const T = k => esc(t(k));


const dots = '<span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>';
const bar = title => `<div class="bar">${dots}<div class="t">${title}</div></div>`;
const clip = (n, ic, title, meta, on) =>
  `<div class="clip ${on ? 'on' : ''}"><div class="n">${n}</div><div class="ic">${ic}</div><div class="tx"><b>${title}</b><span>${meta}</span></div></div>`;
const foot = () => `<div class="foot"><span><span class="key">⏎</span>${T('ui.copy')}</span><span><span class="key">⌘1–9</span>${T('ui.jump')}</span><span><span class="key">⌘Y</span>${T('ui.preview')}</span></div>`;
const menubar = app => `<div class="menubar"><span style="font-size:15px">&#xF8FF;</span><b>${app}</b><span>${T('menu.file')}</span><span>${T('menu.edit')}</span><span>${T('menu.view')}</span><span>${T('menu.window')}</span><span>${T('menu.help')}</span><span class="sp"></span><span>📋</span><span>${T('menu.clock')}</span></div>`;

/* A frame: glow colours, the header (by key prefix), the wallpaper, the scene
   in screen coordinates, and tags in page coordinates. A tag given `right`
   is anchored by its right edge, so a longer translation grows leftwards. */
const tag = ({ key, left, right, top, tail }) =>
  `<div class="tag ${tail || ''}" style="${right !== undefined ? `right:${right}px;` : `left:${left}px;`} top:${top}px;">${T(key)}</div>`;
const frame = ({ g1, g2, prefix, wall, app, scene, tags = [] }) => `
<section class="frame" style="--g1:${g1}; --g2:${g2}; --t1:${g1}; --t2:${g2}">
  <div class="head" ${RTL ? 'dir="rtl"' : ''}>
    <div class="eyebrow">${T(prefix + '.eyebrow')}</div>
    <h1>${T(prefix + '.title')}</h1>
    <div class="sub">${T(prefix + '.sub')}</div>
  </div>
  <div class="display"><div class="screen wall-${wall}">${menubar(app)}${scene}</div></div>
  ${tags.map(tag).join('')}
</section>`;

const frames = {

/* Shrinks whatever a longer language would push past its room. */
function fit() {
  // The text's own width, not its box's: the heading block always spans the
  // page, so measuring the block shrank every title, fitting or not.
  const textWidth = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
  const h1 = document.querySelector('h1');
  if (h1) {
    h1.style.whiteSpace = 'nowrap';
    let size = 60;
    while (textWidth(h1) > 1340 && size > 30) { size -= 1; h1.style.fontSize = size + 'px'; }
  }
  const sub = document.querySelector('.sub');
  let subSize = 23;
  while (sub && sub.getBoundingClientRect().height > subSize * 1.38 * 2 + 4 && subSize > 16) { subSize -= 1; sub.style.fontSize = subSize + 'px'; }
  document.querySelectorAll('.tag').forEach(el => {
    if (RTL) el.setAttribute('dir', 'rtl');
    let tagSize = 21;
    const fits = () => { const r = el.getBoundingClientRect(); return r.left >= 10 && r.right <= 1430; };
    while (!fits() && tagSize > 12) { tagSize -= 1; el.style.fontSize = tagSize + 'px'; }
  });
}

window.S_LANG = LANG === 'en' ? undefined : window.S;
document.documentElement.lang = LANG;
document.body.innerHTML = (frames[N] || frames[1])();
fit();
</script>
